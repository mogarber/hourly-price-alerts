name: HourlyPriceAlerts

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  HourlyPriceKit:
    path: Packages/HourlyPriceKit

targets:
  HourlyPriceAlerts:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HourlyPriceKit
    # Bundle id, team, entitlements, and API_BASE_URL come from Config/App.xcconfig (and the git-ignored
    # Config/Local.xcconfig). Do not set them in settings below, target-level settings would override
    # the xcconfig.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_NAME: HourlyPriceAlerts
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Price Alerts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        HPAApiBaseURL: $(API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        # No UIBackgroundModes: alerts are plain alert pushes, which need no background processing.

schemes:
  HourlyPriceAlerts:
    build:
      targets:
        HourlyPriceAlerts: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HourlyPriceKit/HourlyPriceKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
