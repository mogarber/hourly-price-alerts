name: Deploy backend

# Deploys backend/HourlyPriceAlerts.Functions to the Flex Consumption function app created by infra/main.bicep.
#
# One-time setup, as repository variables (Settings > Secrets and variables > Actions > Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  an Entra app registration with a federated credential
#                                                            for this repository, which has Contributor on the
#                                                            function app (or its resource group)
#   AZURE_FUNCTIONAPP_NAME                                   the functionAppName output of the Bicep deployment
# No secrets are needed: azure/login uses OIDC.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the repository variables above are set, including in forks.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test backend/HourlyPriceAlerts.sln --configuration Release

      - name: Publish
        run: dotnet publish backend/HourlyPriceAlerts.Functions/HourlyPriceAlerts.Functions.csproj --configuration Release --output ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          sku: flexconsumption
